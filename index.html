    <script>

        /*
         * Keep the game focused so keyboard controls work.
         */
        var gameElement =
            document.getElementById('openfl-content');

        function keepFocus() {
            if (gameElement) {
                gameElement.focus();
            }
        }

        if (gameElement) {
            gameElement.addEventListener(
                'blur',
                keepFocus
            );

            gameElement.addEventListener(
                'focusout',
                keepFocus
            );
        }

        /*
         * Prevent the browser from scrolling while playing.
         */
        function doScroll(event) {
            window.scroll(
                0,
                window.scrollY + event.deltaY
            );
        }

        if (gameElement) {
            gameElement.addEventListener(
                "wheel",
                doScroll
            );
        }

        /*

         */
        setInterval(function() {

                document.activeElement &&
                document.activeElement.tagName == "IFRAME"
            ) {
                document.activeElement.blur();

                if (gameElement) {
                    gameElement.focus();
                }
            }
